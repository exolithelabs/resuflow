[package]
name = "resuflow"
version = "0.1.1"
description = "ResuFlow desktop shell"
license = "Apache-2.0"
authors = ["ResuFlow"]
edition = "2021"

[lib]
name = "resuflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
