<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ResuFlow</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">ResuFlow</a>
    <a class="back-home" id="back-home" href="#/" hidden>← All resumes</a>
    <p id="save-status" class="save-status" hidden></p>
    <div class="settings-menu">
      <button type="button" class="settings-btn" id="settings-btn" aria-haspopup="true" aria-expanded="false" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
      <nav class="settings-dropdown" id="settings-dropdown" hidden>
        <a href="#/vault">Vault</a>
        <a href="#/profile">Profile</a>
        <a href="#/skills">Skills</a>
        <a href="#/memory">Memory</a>
        <a href="#/docs">Read docs</a>
        <button type="button" id="check-updates">Check for updates</button>
        <button type="button" id="open-browser">Open in browser</button>
      </nav>
    </div>
  </header>

  <aside class="release-notice" id="release-notice" role="status" hidden>
    <div>
      <strong id="release-title">A new ResuFlow release is available.</strong>
      <span id="release-detail"></span>
    </div>
    <div class="release-actions">
      <a class="secondary" id="release-link" href="#" target="_blank" rel="noreferrer">View release</a>
      <button class="ghost" id="release-dismiss" type="button" aria-label="Dismiss update notification">Dismiss</button>
    </div>
  </aside>

  <main id="app" class="app"></main>

  <dialog id="create-dialog" class="dialog">
    <form id="create-form" method="dialog">
      <h2>New resume</h2>
      <p>Each resume is a role-specific variant. Shared contact details live in your profile.</p>
      <label>
        <span>Target role / title</span>
        <input id="create-title" name="title" required placeholder="Technical Product Manager" />
      </label>
      <div class="dialog-actions">
        <button type="button" class="ghost" id="create-cancel">Cancel</button>
        <button type="submit" class="primary">Create</button>
      </div>
    </form>
  </dialog>

  <dialog id="skill-dialog" class="dialog">
    <form id="skill-form" method="dialog">
      <h2>New skill</h2>
      <p>Custom skills are Markdown instructions the agent can load.</p>
      <label>
        <span>Name</span>
        <input id="skill-name" name="name" required placeholder="Cover letter tone" />
      </label>
      <div class="dialog-actions">
        <button type="button" class="ghost" id="skill-cancel">Cancel</button>
        <button type="submit" class="primary">Create</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
