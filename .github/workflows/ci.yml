name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

jobs:
  node:
    name: Node (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm audit --audit-level=high

      - run: npm test

      - run: npm run distro:check

      - name: CLI help
        run: node bin/resuflow.mjs --help

      - name: Init workspace and start server
        shell: bash
        run: |
          workdir="${RUNNER_TEMP}/resume-workspace"
          node bin/resuflow.mjs init "$workdir"
          node bin/resuflow.mjs serve --dir "$workdir" --port 4173 --no-open &
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:4173/api/health" >/dev/null; then
              curl -fsS "http://127.0.0.1:4173/api/health"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy"
          exit 1

  desktop-shell:
    name: Desktop shell tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci
      - run: npm run desktop:prepare
      - run: cargo test --manifest-path src-tauri/Cargo.toml
